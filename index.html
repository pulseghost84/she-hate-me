<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHE HATES ME 1.0</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #0b0b10;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 25px 18px;
}

.container {
    max-width: 650px;
    margin: auto;
}

h1 {
    color: #ff365d;
    font-size: 32px;
    letter-spacing: 2px;
    margin-top: 45px;
}

.photos {
    margin-top: 35px;
    padding: 20px;
    background: #171720;
    border: 1px solid #333340;
    border-radius: 12px;
}

.photos h2 {
    margin: 0;
    font-size: 19px;
    letter-spacing: 3px;
}

.copy-button {
    width: 100%;
    margin-top: 65px;
    padding: 22px 12px;
    background: #ff365d;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.copy-button:hover {
    background: #e52349;
}

.status {
    min-height: 24px;
    margin-top: 20px;
    color: #75ffab;
}

footer {
    margin-top: 90px;
    color: #777;
    font-size: 12px;
}
</style>
</head>

<body>
<div class="container">

    <h1>SHE HATES ME 1.0</h1>

    <section class="photos">
        <h2>SOME PHOTOS</h2>
    </section>

    <button class="copy-button" onclick="copyCommand()">
        📋 COPY TEXT / COMMAND
    </button>

    <p class="status" id="status"></p>

    <footer>SHE HATES ME 1.0</footer>

</div>

<script>
const textToCopy = `PASTE YOUR FULL TEXT OR COMMAND HERE`;

async function copyCommand() {
    const status = document.getElementById("status");

    try {
        await navigator.clipboard.writeText(textToCopy);
        status.textContent = "✓ TEXT COPIED SUCCESSFULLY!";
    } catch (error) {
        const area = document.createElement("textarea");
        area.value = textToCopy;
        area.style.position = "fixed";
        area.style.left = "-9999px";
        document.body.appendChild(area);
        area.select();

        const success = document.execCommand("copy");
        area.remove();

        status.textContent = success
            ? "✓ TEXT COPIED SUCCESSFULLY!"
            : "Copy failed. Please try again.";
    }
}
</script>
</body>
</html>
